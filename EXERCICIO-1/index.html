<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2>Formulario de Contacto</h2>
        <form id="registroForm" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" required>
                <div class="invalid-feedback">Por favor, ingresa tu nombre.</div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" required>
                <div class="invalid-feedback">Por favor, ingresa un correo válido.</div>
            </div>
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" rows="4" required minlength="40" maxlength="500"></textarea>
                <div class="invalid-feedback">
                    Por favor, ingresa tu mensaje de consulta (mínimo 40 y máximo 500 caracteres).
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        <div id="mensajeExito" class="alert alert-success mt-3 d-none">
            Tu mensaje ha sido enviado con éxito.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script oficial de Bootstrap 5 para validación de formularios
        (() => {
            'use strict';
            const form = document.getElementById('registroForm');
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    event.preventDefault();
                    document.getElementById('mensajeExito').classList.remove('d-none');
                    form.classList.remove('was-validated');
                    form.reset();
                    setTimeout(() => {
                        document.getElementById('mensajeExito').classList.add('d-none');
                    }, 3000);
                }
                form.classList.add('was-validated');
            }, false);
        })();
    </script>
</body>

</html>
